<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake — redirecting</title>
</head>
<body>
  <p>Opening Snake…</p>
  <script>
    (function () {
      var base = '/snake/';
      var requested = location.pathname + location.search + location.hash;
      if (requested === base || requested === '/snake') {
        location.replace(base);
      } else {
        location.replace(base + '?route=' + encodeURIComponent(requested));
      }
    })();
  </script>
</body>
</html>
