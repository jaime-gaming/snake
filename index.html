<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="SNAKE ultra frenético: cuatro modos, campaña de 12 niveles, minimalismo en blanco y negro.">
<title>SNAKE — ultra frenético</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='2' y='7' width='4' height='4' fill='%23fff'/%3E%3Crect x='6' y='7' width='4' height='4' fill='%23fff'/%3E%3Crect x='10' y='7' width='2' height='4' fill='%23fff'/%3E%3Crect x='13' y='2' width='3' height='3' fill='%23ff2b2b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body data-screen="home">
  <div id="app">
    <header id="topbar">
      <span class="brand">SNAKE<span class="dot">.</span></span>
      <div class="tools">
        <button id="btn-mute" class="tool" type="button" aria-pressed="false" title="Sonido (M)">
          <span class="led" aria-hidden="true"></span>SONIDO
        </button>
        <button id="btn-pause" class="tool" type="button" disabled title="Pausa (P)">PAUSA</button>
      </div>
    </header>

    <section id="hud" aria-live="off">
      <div class="hud-col">
        <span class="label" id="hud-meta">ELIGE UN MODO</span>
        <span class="value" id="hud-score">—</span>
      </div>
      <div class="hud-col right">
        <span class="label" id="hud-best">&nbsp;</span>
        <span class="mult" id="hud-mult"></span>
      </div>
    </section>

    <main id="stage">
      <canvas id="board" aria-label="Tablero de juego"></canvas>
      <div id="prompt">PULSA UNA DIRECCIÓN</div>
      <div id="overlay"></div>
    </main>

    <footer id="footer">
      <div id="combo" aria-hidden="true"><div id="chain-bar"></div></div>
      <div class="foot-row">
        <p id="hint"></p>
        <span id="turbo-label" aria-hidden="true">TURBO</span>
      </div>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
