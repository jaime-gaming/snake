<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="https://snake.jaime-gaming.com/">
<meta id="meta-description" name="description" content="Snake: serpientes de bloques en blanco y negro. Campaña, infinitos, contrarreloj y un competitivo de cuatro tableros con rangos.">
<title>Snake</title>
<script>
  (function () {
    var route = new URLSearchParams(location.search).get('route');
    if (!route) return;
    try {
      var target = new URL(route, location.origin);
      history.replaceState(null, '', target.pathname + target.search + target.hash);
    } catch (error) {
      // Si la ruta de retorno no es válida, dejamos que arranque la portada.
    }
  })();
</script>
<script>
  (function () {
    var base = './';
    if (location.protocol !== 'file:') {
      base = (location.pathname === '/snake' || location.pathname.indexOf('/snake/') === 0) ? '/snake/' : '/';
    }
    document.write('<base href="' + base + '">');
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='2' y='7' width='4' height='4' fill='%23fff'/%3E%3Crect x='6' y='7' width='4' height='4' fill='%23fff'/%3E%3Crect x='10' y='7' width='2' height='4' fill='%23fff'/%3E%3Crect x='13' y='2' width='3' height='3' fill='%23ff2b2b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=28">
</head>
<body data-screen="home">
  <div id="app">
    <header id="topbar">
      <span class="brand">snake<span class="dot">.</span></span>
      <div class="stats">
        <span id="hud-meta" class="meta">cargando…</span>
        <span id="hud-score" class="score">—</span>
        <span id="hud-mult" class="mult"></span>
        <span id="hud-best" class="best"></span>
      </div>
      <div class="tools">
        <label class="language-control">
          <span class="sr-only" data-i18n="language">Idioma</span>
          <select id="lang-switch" data-i18n-aria="language" aria-label="Idioma">
            <option value="es">ES</option>
            <option value="en">EN</option>
          </select>
        </label>
        <button id="btn-mute" class="tool" type="button" aria-pressed="true" data-i18n-title="soundTitleOn" title="sonido activo (M)">
          <i class="led" aria-hidden="true"></i><span data-i18n="sound">sonido</span>
        </button>
        <button id="btn-pause" class="tool" type="button" disabled data-i18n-title="pauseTitle" title="pausa (P)" data-i18n="pause">pausa</button>
      </div>
      <div id="comp-ventaja" hidden aria-live="polite">
        <b id="comp-ventaja-texto"></b>
        <span id="comp-ventaja-detalle"></span>
        <span id="comp-publico" role="img" aria-label=""></span>
      </div>
    </header>

    <main id="stage">
      <canvas id="board" data-i18n-aria="board" aria-label="tablero"></canvas>
      <div id="arena" hidden>
        <figure class="tablero"><canvas></canvas><figcaption><span class="tablero-puesto"></span><span class="tablero-nombre">tú</span><span class="tablero-datos">0</span><span class="tablero-estado"></span></figcaption></figure>
        <figure class="tablero"><canvas></canvas><figcaption><span class="tablero-puesto"></span><span class="tablero-nombre">kobra</span><span class="tablero-datos">0</span><span class="tablero-estado"></span></figcaption></figure>
        <figure class="tablero"><canvas></canvas><figcaption><span class="tablero-puesto"></span><span class="tablero-nombre">víbora</span><span class="tablero-datos">0</span><span class="tablero-estado"></span></figcaption></figure>
        <figure class="tablero"><canvas></canvas><figcaption><span class="tablero-puesto"></span><span class="tablero-nombre">mamba</span><span class="tablero-datos">0</span><span class="tablero-estado"></span></figcaption></figure>
      </div>
      <div id="cuenta" hidden aria-hidden="true"><b>3</b></div>
      <div id="reloj" hidden aria-hidden="true"><b>30</b><span>s</span><em id="reloj-fase"></em></div>
      <div id="senal" data-i18n="startSignal">pulsa una dirección</div>
      <div id="overlay"></div>
    </main>

    <p id="aviso-foco" data-i18n="focusHint" hidden>toca el tablero para despertar el teclado</p>

    <footer id="footer">
      <div id="combo" aria-hidden="true"><div id="chain-bar"></div></div>
      <div class="foot-row">
        <p id="hint"></p>
        <ul id="effects" class="effects"></ul>
      </div>
    </footer>
  </div>

  <canvas id="barrido" hidden aria-hidden="true"></canvas>

  <div id="fatal" hidden role="alert">
    <p class="fatal-title" data-i18n="fatalTitle">el juego no ha arrancado</p>
    <p id="fatal-text" class="fatal-text"></p>
    <p class="fatal-actions">
      <button type="button" id="fatal-reload" data-i18n="fatalReload">recargar limpio</button>
    </p>
  </div>

  <noscript>
    <div id="sin-js" data-i18n="noScript">este juego necesita su motor en marcha.</div>
  </noscript>

  <script>
    (function () {
      var caja = document.getElementById('fatal');
      var texto = document.getElementById('fatal-text');
      var arrancado = false;

      function fallo(mensaje) {
        if (!caja || arrancado) return;
        texto.textContent = mensaje;
        caja.hidden = false;
      }

      window.__snakeFallo = fallo;
      window.__snakeArrancado = function () {
        arrancado = true;
        document.documentElement.dataset.booted = '1';
        if (caja) caja.hidden = true;
      };

      window.addEventListener('error', function (evento) {
        var objetivo = evento.target || {};
        if (objetivo.tagName === 'SCRIPT' || objetivo.tagName === 'LINK') {
          fallo('no se pudo colocar una pieza del tablero.');
          return;
        }
        fallo(evento.message || 'el tablero ha perdido el trazo.');
      }, true);

      window.addEventListener('unhandledrejection', function (evento) {
        var motivo = evento.reason;
        fallo('el tablero ha hecho un movimiento imposible.');
      });

      document.getElementById('fatal-reload').addEventListener('click', function () {
        location.replace(location.pathname + '?v=' + Date.now());
      });

      setTimeout(function () {
        if (!document.documentElement.dataset.booted) {
          fallo('el tablero no ha despertado en 4 s. vuelve a abrirlo.');
        }
      }, 4000);
    })();
  </script>

  <script src="snake.js?v=28"></script>
</body>
</html>
